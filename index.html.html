function calc(r){
 if(blank(r.b)||blank(r.e))return{rev:0,vol:0,flag:'',pb:false,bb:false,eb:false};
 const b=num(r.b),e=num(r.e),p=blank(r.p)?0:num(r.p),bb=!(b>=0),eb=!(e>=0),pb=isNaN(p);
 if(bb||eb)return{rev:0,vol:0,flag:'!',pb,bb,eb};
 const vol=Math.abs(b-e);return{rev:pb?0:vol*p,vol,flag:pb?'!':'',pb,bb,eb};
}

async function boot(){
 applyLang();
 try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){}
 if(!db||!user){app.innerHTML=`<p class="note">${window.__cfgMissing?t('cfgMissing'):t('noConn')}</p>`;return}
 AUID=await user.id();uid=AUID;
 const m=await db.doc('data/users/'+AUID+'/me').get();
 if(m.exists){const x=m.data();
  if(x.role==='owner'&&await user.isOwner()){ME=x;return start()}
  if(x.role!=='owner'){const[a,c]=await Promise.all([db.doc('access/'+x.h).get(),db.doc('claims/'+x.h).get()]);
   if(a.exists&&c.exists&&c.data().dev===DEV){ME=x;uid=stableId(x);return start()}
   if(a.exists)return gate()
   if(!a.exists)return gate(t('removed'))}}
 if(await user.isOwner()){const nm=(await user.me()).name||'';ME={tid:AUID,role:'owner',K:b64(crypto.getRandomValues(new Uint8Array(32))),email:nm};await db.doc('data/users/'+AUID+'/me').set(ME);return start()}
 gate();
}
const DAY=24*60*60*1000;
function expired(){let at=0;try{at=+sessionStorage.getItem('mr:at')||0}catch(_){}return !at||Date.now()-at>DAY}

function heartbeat(){let busy=false;const beat=async()=>{if(busy||!ME||!ME.h)return;busy=true;try{const c=await db.doc('claims/'+ME.h).get();
  if(!c.exists||c.data().dev!==DEV){window.__flush=null;ME=null;gate(c.exists?t('taken'):t('removed'))}}catch(e){}finally{busy=false}};
 setInterval(beat,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)beat()})}

const stableId=x=>x.role==='worker'?'w_'+x.wid:x.role==='business'?'b_'+x.h:AUID;
async function claim(email,code){
 email=email.trim().toLowerCase();const h=await accH(email,code),a=await db.doc('access/'+h).get();if(!a.exists)return false;
 const c=await db.doc('claims/'+h).get();if(c.exists&&c.data().dev!==DEV)return 'taken';await db.doc('claims/'+h).set({uid:AUID,dev:DEV})
 const x=a.data(),kk=await kdf(code,email);let me;
 if(x.role==='worker'){const w=await dec(kk,x.wrap);me={tid:x.tid,role:'worker',wid:x.wid,h,email,K:w.k,C:w.c}}
 else{let K;if(x.bwrap)K=(await dec(kk,x.bwrap)).k;else{K=b64(crypto.getRandomValues(new Uint8Array(32)));await db.doc('access/'+h).update({bwrap:await enc(kk,{k:K})})}
  me={tid:'b_'+h,role:'business',h,email,K}}
 await db.doc('data/users/'+AUID+'/me').set(me);try{sessionStorage.setItem('mr:in','1');sessionStorage.setItem('mr:at',String(Date.now()))}catch(_){}ME=me;uid=stableId(me);MYK=null;NAMES=null;start();return true;
}

async function doExport(){

  else{if(!window.jspdf||!window.jspdf.jsPDF){st.textContent=t('lib');return}const doc=new window.jspdf.jsPDF();doc.setFontSize(13);doc.text('Meter Readings  '+f+' - '+tt,14,15);

  st.textContent=t('done');
