function calc(r,cap){if(num(r.c)>0)cap=num(r.c);else if(r.g)cap=Infinity;
 if(blank(r.b)||blank(r.e))return{rev:0,vol:0,flag:'',pb:false,bb:false,eb:false};
 const b=num(r.b),e=num(r.e),p=blank(r.p)?0:num(r.p),bb=!(b>=0&&b<=cap),eb=!(e>=0&&e<=cap),pb=isNaN(p);
 if(bb||eb)return{rev:0,vol:0,flag:'!',pb,bb,eb};
 if(e>b&&r.g&&!(num(r.c)>0))return{rev:0,vol:0,flag:'size',pb,bb,eb};const vol=e<=b?b-e:b+cap-e;return{rev:pb?0:vol*p,vol,flag:pb?'!':'',pb,bb,eb};
}

async function boot(){
 applyLang();
 try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){}
 if(!db||!user){app.innerHTML=`<p class="note">${window.__cfgMissing?'Setup needed: paste your Firebase config and owner email at the top of index.html.':'Could not connect. Check your internet connection and reload.'}</p>`;return}
 uid=await user.id();
 const m=await db.doc('data/users/'+uid+'/me').get();
 if(m.exists){const x=m.data();
  if(x.role==='owner'){ME=x;return start()}
  const[a,c]=await Promise.all([db.doc('access/'+x.h).get(),db.doc('claims/'+x.h).get()]);
  if(a.exists&&c.exists&&c.data().uid===uid&&c.data().dev===DEV){ME=x;return start()}
  return gate(a.exists?t('taken'):t('removed'))}
 if(await user.isOwner()){const nm=(await user.me()).name||'';ME={tid:uid,role:'owner',K:b64(crypto.getRandomValues(new Uint8Array(32))),email:nm};await db.doc('data/users/'+uid+'/me').set(ME);return start()}
 gate();
}
async function claim(email,code){
 email=email.trim().toLowerCase();const h=await accH(email,code),a=await db.doc('access/'+h).get();if(!a.exists)return false;
 const c=await db.doc('claims/'+h).get();if(c.exists&&(c.data().uid!==uid||c.data().dev!==DEV))return 'taken';
 const x=a.data();let me;
 if(x.role==='worker'){const w=await dec(await kdf(code,email),x.wrap);me={tid:x.tid,role:'worker',wid:x.wid,h,email,K:w.k,C:w.c}}
 else{const old=await db.doc('data/users/'+uid+'/me').get();me=old.exists&&old.data().role==='business'?{...old.data(),h,email}:{tid:uid,role:'business',h,email,K:b64(crypto.getRandomValues(new Uint8Array(32)))}}
 await db.doc('claims/'+h).set({uid,dev:DEV});await db.doc('data/users/'+uid+'/me').set(me);ME=me;MYK=null;NAMES=null;start();return true;
}

 langMenu(()=>gate(m));

 $('#bo').onclick=e=>{e.preventDefault();$('#ol').hidden=!$('#ol').hidden};const og=async()=>{$('#om').textContent='';try{await window.__ownerLogin($('#oe').value,$('#op').value)}catch(er){$('#om').textContent='Wrong email or password.'}};$('#og').onclick=og;$('#op').onkeydown=e=>{if(e.key==='Enter')og()};$('#go').onclick=go;$('#gc').onkeydown=e=>{if(e.key==='Enter')go()};
}

 lm.onclick=async e=>{const l=e.target.dataset.l;if(!l)return;if(window.__flush)await window.__flush();LANG=l;try{localStorage.setItem('mr:lang',l)}catch(_){}applyLang();after()};
 document.addEventListener('click',e=>{if(lm.isConnected&&!lm.hidden&&!lm.contains(e.target))lm.hidden=true});
}

 if(p==='week'){const s=new Date(d);s.setDate(d.getDate()-((d.getDay()+6)%7)-7);const e=new Date(s);e.setDate(s.getDate()+6);return[ymd(s),ymd(e)]}

 const prevR=(f,tt)=>{const a=dd(f),n=Math.round((dd(tt)-a)/864e5)+1,pe=new Date(a),ps=new Date(a);pe.setDate(a.getDate()-1);ps.setDate(a.getDate()-n);return[ymd(ps),ymd(pe)]};

 const flat=a=>{const o=[];a.forEach(d=>d.rows.forEach(r=>{const k=calc(r,d.cap||50);o.push({date:d.date,worker:d.worker,n:r.n||'',p:r.p,b:r.b,e:r.e,rev:k.rev,vol:k.vol,fl:k.flag})}));return o};
 async function hist(f,tt,sel){const col=db.collection('t/'+ME.tid+'/audit'),s=TO()?await col.get():await col.where('u','==',uid).get(),nm=await nameMap(),items=[];
  for(const d of s.docs){const x=d.data();if(x.d<f||x.d>tt||(sel&&x.l!==sel))continue;try{const p=await dec(TO()?await derive(KT(),x.l):await myKey(),x.enc);items.push({d:x.d,ts:x.ts,by:p.by||nm[x.l]||'',ch:p.ch||[]})}catch(e){}}
  items.sort((a,b)=>b.ts-a.ts);$('#al').innerHTML=items.slice(0,60).map(x=>`<div style="margin:6px 0;border-top:1px solid var(--line);padding-top:6px"><b>${esc(x.d)}</b> · ${esc(x.by)} · ${esc(new Date(x.ts).toLocaleString())}<br>${x.ch.map(c=>esc(chTxt(c))).join(' · ')}</div>`).join('')||t('noHist')}
 let tok=0;
 async function show(){
  const my=++tok,rg=getRange('r');if(!rg){$('#rn').textContent=t('pick');return}const[f,tt]=rg,sel=TO()?$('#rw').value:'',all=TO()&&!sel;$('#rn').textContent=t('loading');
  try{
   const[pf,pt]=prevR(f,tt),[a0,b0]=await Promise.all([loadDays(f,tt,sel),loadDays(pf,pt,sel)]);if(my!==tok)return;
   const q=$('#rq').value.trim().toLowerCase(),mv=num($('#rm').value),fg=$('#rg').checked;
   const filt=r=>(!q||[r.date,r.worker,r.p,r.b,r.e].join(' ').toLowerCase().includes(q))&&(isNaN(mv)||r.vol>=mv)&&(!fg||r.fl);
   const out=flat(a0).filter(filt).sort((a,b)=>a.date.localeCompare(b.date)||a.worker.localeCompare(b.worker)),pre=flat(b0).filter(filt);
   const sm=(a,k)=>a.reduce((s,r)=>s+r[k],0),R=sm(out,'rev'),V=sm(out,'vol');
   const cols=['date'].concat(all?['worker']:[],['n','p','b','e','rev','vol']),H={date:t('date'),worker:t('worker'),n:t('game'),p:t('price'),b:t('begin'),e:t('end'),rev:t('rev'),vol:t('vol')};
   $('#rh').innerHTML='<tr>'+cols.map(c=>`<th class="${c==='rev'||c==='vol'?'n':''}">${H[c]}</th>`).join('')+'</tr>';
   $('#rb').innerHTML=out.map(r=>'<tr>'+cols.map(c=>c==='rev'||c==='vol'?`<td class="n">${fmt(r[c])}</td>`:`<td>${esc(r[c])}</td>`).join('')+'</tr>').join('')||`<tr><td colspan="${cols.length}" class="note">${t('none')}</td></tr>`;
   $('#rk1').textContent=fmt(R);$('#rk2').textContent=fmt(V);$('#rk3').textContent=out.length;$('#rd1').textContent=dTxt(R,sm(pre,'rev'));$('#rd2').textContent=dTxt(V,sm(pre,'vol'));
   const span=Math.round((dd(tt)-dd(f))/864e5)+1,g=span>62?(d=>d.slice(0,7)):(d=>d),by={};out.forEach(r=>{by[g(r.date)]=(by[g(r.date)]||0)+r.rev});
   const ks=Object.keys(by).sort(),mx=Math.max(1,...ks.map(k=>by[k]));
   $('#rbars').innerHTML=ks.map(k=>`<i title="${k}: ${fmt(by[k])}" style="height:${Math.max(3,by[k]/mx*100)}%"></i>`).join('');$('#rax').textContent=ks.length?ks[0]+(ks.length>1?' → '+ks[ks.length-1]:''):'';
   if(all){const bw={};out.forEach(r=>{bw[r.worker]=(bw[r.worker]||0)+r.rev});const tp=Object.entries(bw).sort((a,b)=>b[1]-a[1]).slice(0,5),m2=Math.max(1,...tp.map(x=>x[1]));
    $('#rtop').innerHTML=tp.length?`<h3 class="sec">${t('top')}</h3>`+tp.map(x=>`<div class="tw"><span>${esc(x[0])}</span><div style="flex:1"><i style="width:${x[1]/m2*100}%"></i></div><b>${fmt(x[1])}</b></div>`).join(''):''}else $('#rtop').innerHTML='';
   $('#rn').textContent=f+' → '+tt;
   const rr=reconRows(a0),cR=['date'].concat(all?['worker']:[],['sales','p','x','ex','k','ov']),RHd=reconHead();
   $('#rrh').innerHTML='<tr>'+cR.map(c=>`<th class="${c==='date'||c==='worker'?'':'n'}">${RHd[c]}</th>`).join('')+'</tr>';
   $('#rrb').innerHTML=rr.map(r=>'<tr>'+cR.map(c=>c==='date'||c==='worker'?`<td>${esc(r[c])}</td>`:`<td class="n"${c==='ov'&&r.ov!=null&&Math.abs(r.ov)>(CAT.tol??5)?' style="color:var(--bad);font-weight:700"':''}>${r[c]==null?'—':fmt(r[c])}</td>`).join('')+'</tr>').join('')||`<tr><td colspan="${cR.length}" class="note">${t('none')}</td></tr>`;
   await hist(f,tt,sel);
  }catch(e){$('#rn').textContent=e.message||e.code}
 }
 (async()=>{if(TO())$('#rw').innerHTML=await workerOpts();['rr','rf','rt','rg'].concat(TO()?['rw']:[]).forEach(i=>$('#'+i).onchange=show);['rq','rm'].forEach(i=>$('#'+i).oninput=show);show()})();

async function doExport(){
 const st=$('#xs'),fm=$('#xm').value,rg=getRange('x');if(!rg){st.textContent=t('pick');return}
 const[f,tt]=rg,sel=TO()?$('#xw').value:'',all=TO()&&!sel;st.textContent=t('loading');
 try{
  const days=await loadDays(f,tt,sel),out=[];days.forEach(d=>d.rows.forEach(r=>{const k=calc(r,d.cap||50);out.push({date:d.date,worker:d.worker,n:r.n||'',p:r.p,b:r.b,e:r.e,rev:k.rev,vol:k.vol})}));
  if(!out.length){st.textContent=t('none');return}
  out.sort((a,b)=>a.date.localeCompare(b.date)||a.worker.localeCompare(b.worker));
  const pdf=fm==='pdf',H=pdf?{date:'Date',worker:'Worker',n:'Game',p:'Price',b:'Begin',e:'End',rev:'Revenue',vol:'Volume'}:{date:t('date'),worker:t('worker'),n:t('game'),p:t('price'),b:t('begin'),e:t('end'),rev:t('rev'),vol:t('vol')};
  const cols=['date'].concat(all?['worker']:[],['n','p','b','e','rev','vol']),nv=v=>blank(v)?'':(isNaN(num(v))?v:num(v));
  const head=cols.map(c=>H[c]),body=out.map(r=>cols.map(c=>['p','b','e'].includes(c)?nv(r[c]):r[c]));
  const base='readings_'+f+'_to_'+tt,dl=await claude.use('downloads');if(!dl){st.textContent=t('noDl');return}
  if(fm==='csv'){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';await dl.save({filename:base+'.csv',data:new Blob(['\ufeff'+[head].concat(body).map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'})})}
  else if(fm==='xlsx'){if(!window.XLSX){st.textContent=t('lib');return}const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([head].concat(body)),'Readings');await dl.save({filename:base+'.xlsx',data:new Uint8Array(XLSX.write(wb,{bookType:'xlsx',type:'array'}))})}
  else{if(!window.jspdf||!window.jspdf.jsPDF){st.textContent=t('lib');return}const doc=new window.jspdf.jsPDF();doc.setFontSize(13);doc.text('Meter Readings  '+f+' - '+tt,14,15);
   doc.autoTable({head:[head],body:body.map(r=>r.map(v=>typeof v==='number'?fmt(v):v)),startY:20,styles:{fontSize:9},headStyles:{fillColor:[109,40,217]},alternateRowStyles:{fillColor:[245,243,255]}});
   await dl.save({filename:base+'.pdf',data:new Uint8Array(doc.output('arraybuffer'))})}
  st.textContent=t('done');
 }catch(e){st.textContent=e.code==='declined'?t('cancel'):t('fail')+(e.message||e.code)}
}

function accessView(kind){
 const biz=kind==='business';
 $('#page').innerHTML=`<div class="card"><h3 class="sec" style="margin-top:0">${biz?t('bizH'):t('access')}</h3>${biz?`<p class="note">${t('bizNote')}</p>`:''}<label>${t('pemail')}</label><input type="email" id="ae" placeholder="name@example.com"><div class="acts"><button class="p" id="ag">${t('share')}</button></div><p class="note" id="as"></p><div id="inv"></div></div><div class="card"><h3 class="sec" style="margin-top:0">${t('people')}</h3><div id="pl"></div></div>`;
 async function list(){const l=(await people()).filter(p=>p.kind===kind);
  $('#pl').innerHTML=l.map(p=>`<div class="ppl"><span>${esc(p.email)}<br><code>${esc(p.code)}</code></span><button class="rv" data-r="${p.id}" data-h="${p.h}">${t('revoke')}</button></div>`).join('')}
 $('#ag').onclick=async()=>{
  const em=$('#ae').value.trim().toLowerCase(),st=$('#as');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){st.textContent=t('valid');return}
  try{const al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',code=[...crypto.getRandomValues(new Uint8Array(10))].map(x=>al[x%al.length]).join(''),wid=db.collection('t/'+ME.tid+'/people').doc().id,h=await accH(em,code),kt=KT();

   $('#inv').innerHTML=`<p style="margin:10px 0 0">${t('code')}: <code style="font-size:16px">${code}</code> <button type="button" id="cc">${t('copyCode')}</button></p><p class="note">${t('nosend')}</p><div class="acts"><a href="mailto:${encodeURIComponent(em)}?subject=${encodeURIComponent(t('subj'))}&body=${encodeURIComponent(body)}" target="_blank" rel="noopener"><button type="button" class="p">${t('draft')}</button></a><button type="button" id="cp">${t('copyMsg')}</button></div>`;
   const cp=(txt,b)=>{const d=()=>{b.textContent=t('copied')};try{navigator.clipboard.writeText(txt).then(d,()=>{})}catch(_){}};$('#cc').onclick=()=>cp(code,$('#cc'));$('#cp').onclick=()=>cp(body,$('#cp'));
  }catch(e){st.textContent=e.message||e.code}};
 $('#pl').onclick=async e=>{const id=e.target.dataset.r;if(!id)return;const bt=e.target;
  if(bt.dataset.c!=='1'){bt.dataset.c='1';bt.textContent=t('sure');setTimeout(()=>{bt.dataset.c='';bt.textContent=t('revoke')},4000);return}
  try{const h=bt.dataset.h;for(const p of ['claims/'+h,'access/'+h,'t/'+ME.tid+'/prices/'+id])await db.doc(p).delete().catch(()=>{});await db.doc('t/'+ME.tid+'/people/'+id).delete();NAMES=null;$('#as').textContent=t('revoked')}catch(er){$('#as').textContent=er.message||er.code}list()};
 $('#pl').onchange=async e=>{const id=e.target.dataset.p;if(!id)return;const kt=KT(),pk=await derive(kt,'people'),d=await db.doc('t/'+ME.tid+'/people/'+id).get();if(!d.exists)return;
  const p=await dec(pk,d.data().enc),v=e.target.value.trim()===''?'':num(e.target.value);p.price=v;await db.doc('t/'+ME.tid+'/people/'+id).set({enc:await enc(pk,p)});
  await db.doc('t/'+ME.tid+'/prices/'+id).set({enc:await enc(await derive(kt,'w:'+id),{price:v===''?null:v})})};
 list();
}
