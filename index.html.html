let LANG='en';try{const l=localStorage.getItem('mr:lang');if(T[l])LANG=l}catch(e){}
const t=k=>(T[LANG]&&T[LANG][k])??T.en[k]??k;
const applyLang=()=>{document.documentElement.lang=LANG;document.documentElement.dir=RTL.includes(LANG)?'rtl':'ltr'};
const TAB=(()=>{let t='';try{t=sessionStorage.getItem('mr:tab');if(!t){t='t'+Math.random().toString(36).slice(2)+Date.now().toString(36);sessionStorage.setItem('mr:tab',t)}}catch(e){t='t'+Math.random()}return t})();
const DEV=(()=>{let d='nodev';try{d=localStorage.getItem('mr:dev');if(!d){d=crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now();localStorage.setItem('mr:dev',d)}}catch(e){}return d})();
function calc(r){
 if(blank(r.b)||blank(r.e))return{rev:0,vol:0,flag:'',pb:false,bb:false,eb:false};
 const b=num(r.b),e=num(r.e),p=blank(r.p)?0:num(r.p),bb=!(b>=0),eb=!(e>=0),pb=isNaN(p);
 if(bb||eb)return{rev:0,vol:0,flag:'!',pb,bb,eb};
 const vol=Math.abs(b-e);return{rev:pb?0:vol*p,vol,flag:pb?'!':'',pb,bb,eb};
}

let db,user,uid,AUID,ME=null,view='home',MYK=null,NAMES=null;
const WS=()=>ME&&ME.role==='owner',TO=()=>ME&&ME.role!=='worker',LABEL=()=>ME.role==='worker'?'w:'+ME.wid:'o:'+uid,KT=()=>unb(ME.K);
async function myKey(){return MYK||(MYK=ME.role==='worker'?unb(ME.K):await derive(KT(),'o:'+uid))}
async function boot(){
 applyLang();
 try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){}
 if(!db||!user){app.innerHTML=`<p class="note">${window.__cfgMissing?t('cfgMissing'):t('noConn')}</p>`;return}
 AUID=await user.id();uid=AUID;
 const m=await db.doc('data/users/'+AUID+'/me').get();
 if(m.exists){const x=m.data();
  if(x.role==='owner'&&await user.isOwner()){ME=x;return start()}
  if(x.role!=='owner'){const[a,c]=await Promise.all([db.doc('access/'+x.h).get(),db.doc('claims/'+x.h).get()]);
   if(a.exists&&c.exists&&c.data().dev===DEV){ME=x;uid=stableId(x);return start()}
   if(a.exists)return gate()
   if(!a.exists)return gate(t('removed'))}}
 if(await user.isOwner()){const nm=(await user.me()).name||'';ME={tid:AUID,role:'owner',K:b64(crypto.getRandomValues(new Uint8Array(32))),email:nm};await db.doc('data/users/'+AUID+'/me').set(ME);return start()}
 gate();
}
const DAY=24*60*60*1000;
function expired(){let at=0;try{at=+sessionStorage.getItem('mr:at')||0}catch(_){}return !at||Date.now()-at>DAY}
function watchExpiry(){const chk=()=>{if(ME&&expired()){if(ME.role==='owner'){if(window.__flush)window.__flush();window.__signOut()}else codeSignOut()}};setInterval(chk,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});window.addEventListener('focus',chk)}
function heartbeat(){let busy=false;const beat=async()=>{if(busy||!ME||!ME.h)return;busy=true;try{const c=await db.doc('claims/'+ME.h).get();
  if(!c.exists||c.data().dev!==DEV){window.__flush=null;ME=null;gate(c.exists?t('taken'):t('removed'))}}catch(e){}finally{busy=false}};
 setInterval(beat,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)beat()})}
const BC=(()=>{try{return new BroadcastChannel('mr-sessions')}catch(e){return null}})();
if(BC)BC.onmessage=e=>{const d=e.data||{};if(d.q&&ME&&ME.h===d.q)BC.postMessage({a:d.q,id:d.id})};
function otherWindow(h){return new Promise(res=>{if(!BC)return res(false);const id=Math.random().toString(36).slice(2),f=e=>{if(e.data&&e.data.a===h&&e.data.id===id){BC.removeEventListener('message',f);res(true)}};BC.addEventListener('message',f);BC.postMessage({q:h,tab:TAB,id});setTimeout(()=>{BC.removeEventListener('message',f);res(false)},400)})}
const stableId=x=>x.role==='worker'?'w_'+x.wid:x.role==='business'?'b_'+x.h:AUID;
async function claim(email,code){
 email=email.trim().toLowerCase();const h=await accH(email,code),a=await db.doc('access/'+h).get();if(!a.exists)return false;
 const c=await db.doc('claims/'+h).get();if(c.exists&&c.data().dev!==DEV)return 'taken';await db.doc('claims/'+h).set({uid:AUID,dev:DEV})
 const x=a.data(),kk=await kdf(code,email);let me;
 if(x.role==='worker'){const w=await dec(kk,x.wrap);me={tid:x.tid,role:'worker',wid:x.wid,h,email,K:w.k,C:w.c}}
 else{let K;if(x.bwrap)K=(await dec(kk,x.bwrap)).k;else{K=b64(crypto.getRandomValues(new Uint8Array(32)));await db.doc('access/'+h).update({bwrap:await enc(kk,{k:K})})}
  me={tid:'b_'+h,role:'business',h,email,K}}

const reconRows=days=>days.map(d=>{const s=d.rows.reduce((a,r)=>a+calc(r,d.cap||50).rev,0),c=d.cash||{},x=num(c.x)||0,k=num(c.c),ex=s-x;return{date:d.date,worker:d.worker,sales:s,x,ex,k:blank(c.c)||isNaN(k)?null:k,ov:blank(c.c)||isNaN(k)?null:k-ex}}).sort((a,b)=>a.date.localeCompare(b.date)||a.worker.localeCompare(b.worker));
const reconHead=en=>en?{date:'Date',worker:'Name',sales:'Ticket sales',x:'Returned/damaged',ex:'Expected cash',k:'Cash counted',ov:'Over/short'}:{date:t('date'),worker:t('nameL'),sales:t('sales'),x:t('cRet'),ex:t('expct'),k:t('cCount'),ov:t('overS')};
async function doExportRecon(){
 const st=$('#xs'),fm=$('#xm').value,rg=getRange('x');if(!rg){st.textContent=t('pick');return}
 const[f,tt]=rg,sel=WS()?$('#xw').value:'',all=WS()&&!sel;st.textContent=t('loading');
 try{const rr=reconRows(await loadDays(f,tt,sel));if(!rr.length){st.textContent=t('none');return}
  const cols=['date'].concat(all?['worker']:[],['sales','x','ex','k','ov']),H=reconHead(fm==='pdf'),head=cols.map(c=>H[c]),body=rr.map(r=>cols.map(c=>r[c]??''));
  const base='reconciliation_'+f+'_to_'+tt,dl=await claude.use('downloads');if(!dl){st.textContent=t('noDl');return}
  if(fm==='csv'){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';await dl.save({filename:base+'.csv',data:new Blob(['\ufeff'+[head].concat(body).map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'})})}
  else if(fm==='xlsx'){if(!window.XLSX){st.textContent=t('lib');return}const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([head].concat(body)),'Reconciliation');await dl.save({filename:base+'.xlsx',data:new Uint8Array(XLSX.write(wb,{bookType:'xlsx',type:'array'}))})}
  else{if(!window.jspdf||!window.jspdf.jsPDF){st.textContent=t('lib');return}const doc=new window.jspdf.jsPDF();doc.setFontSize(13);doc.text('Daily reconciliation  '+f+' - '+tt,14,15);
   doc.autoTable({head:[head],body:body.map(r=>r.map(v=>typeof v==='number'?fmt(v):v)),startY:20,styles:{fontSize:8},headStyles:{fillColor:[109,40,217]},alternateRowStyles:{fillColor:[245,243,255]}});
   await dl.save({filename:base+'.pdf',data:new Uint8Array(doc.output('arraybuffer'))})}
  st.textContent=t('done')}catch(e){st.textContent=e.code==='declined'?t('cancel'):t('fail')+(e.message||e.code)}
}

 const seg=(id,items,cur)=>`<div class="seg" id="${id}">${items.map(([v,l])=>`<button type="button" data-v="${v}" class="${v===cur?'on':''}">${l}</button>`).join('')}</div>`;

function drawChart(){
 const box=$('#rbars');if(!box)return;const ty=chPref('type')||'bars',m=chPref('metric')||'rev',out=CH.out,g=CH.g;
 const lab=k=>{const[y,mo,da]=k.split('-').map(Number);return da?new Date(y,mo-1,da).toLocaleDateString(LANG,{day:'numeric',month:'short'}):new Date(y,mo-1,1).toLocaleDateString(LANG,{month:'short',year:'numeric'})};
 if(!out.length){box.innerHTML=`<p class="note">${t('none')}</p>`;return}
 let keys,vals,stack=null,names=null;
 if(ty==='week'){const sum=Array(7).fill(0),days=Array(7).fill(null).map(()=>new Set());out.forEach(r=>{const[y,mo,da]=r.date.split('-').map(Number),w=(new Date(y,mo-1,da).getDay()+6)%7;sum[w]+=r[m];days[w].add(r.date)});
  keys=[0,1,2,3,4,5,6].filter(w=>days[w].size);vals=keys.map(w=>sum[w]/days[w].size);
  const ref=new Date(2026,9,19);names=keys.map(w=>{const d=new Date(ref);d.setDate(ref.getDate()+w);return d.toLocaleDateString(LANG,{weekday:'short'})})}
 else{const by={};out.forEach(r=>{const k=g(r.date);(by[k]=by[k]||{v:0,s:{}});by[k].v+=r[m];const gn=String(r.n||'?');by[k].s[gn]=(by[k].s[gn]||0)+r[m]});
  keys=Object.keys(by).sort();vals=keys.map(k=>by[k].v);names=keys.map(lab);
  if(ty==='stack'){const tot={};keys.forEach(k=>{for(const[n,v]of Object.entries(by[k].s))tot[n]=(tot[n]||0)+v});
   const top=Object.keys(tot).sort((a,b)=>tot[b]-tot[a]).slice(0,5).sort((a,b)=>Number(a)-Number(b)||a.localeCompare(b));
   stack={series:top.concat(Object.keys(tot).length>5?['__o']:[]),get:(k,sn)=>sn==='__o'?Object.entries(by[k].s).filter(([n])=>!top.includes(n)).reduce((a,[,v])=>a+v,0):(by[k].s[sn]||0)}}}
 const n=keys.length,W=Math.max(box.clientWidth||320,n*16+56),H=230,P={l:46,r:12,t:28,b:34},iw=W-P.l-P.r,ih=H-P.t-P.b;
 const mxv=Math.max(...vals,0),step=(()=>{const raw=mxv/4||1,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p})(),top=Math.max(step*4,step*Math.ceil(mxv/step));
 const y=v=>P.t+ih-(v/top)*ih,bw=iw/n,x=i=>P.l+bw*i+bw/2,avg=vals.reduce((a,b)=>a+b,0)/n;
 const iMax=vals.indexOf(mxv),mnv=Math.min(...vals),iMin=vals.indexOf(mnv),hl=n>=2&&mxv!==mnv;

 for(let k=0;k<=top/step+.01;k++){const v=k*step,yy=y(v);svg+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" class="gl"/><text x="${P.l-6}" y="${yy+4}" class="ax" text-anchor="end">${short(v)}</text>`}

 if(p==='week'){const s=new Date(d);s.setDate(d.getDate()-((d.getDay()+6)%7)-7);const e=new Date(s);e.setDate(s.getDate()+6);return[ymd(s),ymd(e)]}

 const flat=a=>{const o=[];a.forEach(d=>d.rows.forEach(r=>{const k=calc(r,d.cap||50);o.push({date:d.date,worker:d.worker,n:r.n||'',p:r.p,b:r.b,e:r.e,rev:k.rev,vol:k.vol,fl:k.flag})}));return o};
 async function hist(f,tt,sel){const col=db.collection('t/'+ME.tid+'/audit'),s=TO()?await col.get():await col.where('u','==',uid).get(),nm=await nameMap(),items=[];

  items.sort((a,b)=>b.ts-a.ts);$('#al').innerHTML=items.slice(0,60).map(x=>`<div style="margin:6px 0;border-top:1px solid var(--line);padding-top:6px"><b>${esc(x.d)}</b> · ${esc(x.by)} · ${esc(new Date(x.ts).toLocaleString())}<br>${x.ch.map(c=>esc(chTxt(c))).join(' · ')}</div>`).join('')||t('noHist')}

   const cols=['date'].concat(all?['worker']:[],['n','p','b','e','rev','vol']),H={date:t('date'),worker:t('nameL'),n:t('game'),p:t('price'),b:t('begin'),e:t('end'),rev:t('rev'),vol:t('vol')};

   $('#rk1').textContent=fmt(R);$('#rk2').textContent=fmt(V);$('#rk3').textContent=out.length;$('#rd1').textContent=dTxt(R,sm(pre,'rev'));$('#rd2').textContent=dTxt(V,sm(pre,'vol'));
   const span=Math.round((dd(tt)-dd(f))/864e5)+1,g=span>62?(d=>d.slice(0,7)):(d=>d);CH={out,g};drawChart();$('#rax').textContent=f+' → '+tt;
   if(all){const bw={};out.forEach(r=>{bw[r.worker]=(bw[r.worker]||0)+r.rev});const tp=Object.entries(bw).sort((a,b)=>b[1]-a[1]).slice(0,5),m2=Math.max(1,...tp.map(x=>x[1]));
    $('#rtop').innerHTML=tp.length?`<h3 class="sec">${t('top')}</h3>`+tp.map(x=>`<div class="tw"><span>${esc(x[0])}</span><div style="flex:1"><i style="width:${x[1]/m2*100}%"></i></div><b>${fmt(x[1])}</b></div>`).join(''):''}else $('#rtop').innerHTML='';
   $('#rn').textContent=f+' → '+tt;

   await hist(f,tt,sel);
  }catch(e){$('#rn').textContent=e.message||e.code}

  else{if(!window.jspdf||!window.jspdf.jsPDF){st.textContent=t('lib');return}const doc=new window.jspdf.jsPDF();doc.setFontSize(13);doc.text('Meter Readings  '+f+' - '+tt,14,15);
   doc.autoTable({head:[head],body:body.map(r=>r.map(v=>typeof v==='number'?fmt(v):v)),startY:20,styles:{fontSize:9},headStyles:{fillColor:[109,40,217]},alternateRowStyles:{fillColor:[245,243,255]}});
   await dl.save({filename:base+'.pdf',data:new Uint8Array(doc.output('arraybuffer'))})}
  st.textContent=t('done');
 }catch(e){st.textContent=e.code==='declined'?t('cancel'):t('fail')+(e.message||e.code)}
